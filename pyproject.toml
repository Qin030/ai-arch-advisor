[project]
name = "ai-arch-advisor"
version = "0.1.0"
description = "AI 建築前期決策助理"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langchain>=0.3",
    "chromadb>=0.5",
    "sentence-transformers>=3.3",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "streamlit>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 根目錄有 app/ data/ schema/ 三個目錄，setuptools 的自動偵測會因為
# 無法判斷要打包哪個而拒絕建置。只有 app/ 是 Python 套件，明確指定。
[tool.setuptools]
packages = ["app", "app.api", "app.core", "app.retrieval", "app.rules"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
